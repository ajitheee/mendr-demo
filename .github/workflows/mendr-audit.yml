# Mendr — keeps this repository's retiring-AI-model findings current in your Mendr
# App and carries out the migrations you approve there. Both jobs run HERE, in your
# CI: the audit sends only sanitized findings (paths, line numbers, redacted
# snippets — never your code), proven by this run's OIDC token; the migration
# verifies an approved swap on a throwaway copy, pushes one branch, opens one pull
# request, and never merges. The daily audit catches a newly announced retirement
# when no code has changed. What each job reads and sends, and the one extra GET
# of signed registry files: https://github.com/ajitheee/mendr/blob/v0.5.1-alpha/TRUST.md
#
# ONE SETTING: for the migration to open its pull request, the repository must
# allow it: Settings → Actions → General →
# "Allow GitHub Actions to create and approve pull requests".
# Without it the verified change still lands on a branch, and the finding says so.
#
# SUPPLY CHAIN: both `uses:` lines pin the same Mendr release; bump them together
# (a 40-char commit SHA is the strictest pin). Never point them at a branch.
name: mendr

on:
  schedule:
    - cron: '37 6 * * *' # daily audit, off-the-hour (GitHub throttles :00 crons)
    - cron: '17 * * * *' # carries out approvals made in the App, hourly (free: this repository is public)
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:
    inputs:
      approval:
        description: 'Mendr approval id (the App sets this when it starts the migration)'
        required: false
        default: ''

jobs:
  audit:
    # Every push, pull request, the daily schedule and a manual run — not the approvals check.
    #
    # The second clause skips pull requests opened FROM A FORK. This repository is public, and
    # GitHub gives a fork's pull request a read-only token with no OIDC: the audit could not
    # prove the run to the App even though it has nothing secret to protect. Without this the
    # first contribution a stranger ever sends would show a failed Mendr check it cannot fix.
    if: >-
      (github.event_name != 'schedule' || github.event.schedule == '37 6 * * *') &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read # read the code to scan it
      id-token: write # prove this run to your App; no secret to store
    uses: ajitheee/mendr/.github/workflows/reusable-audit.yml@e68f6047fd38b8bec284296e33a0806c762a41e3
    with:
      app-url: https://mendr-app.onrender.com
      audience: mendr

  migrate:
    # The approvals schedule, and whenever the App starts this workflow — never on a push or pull request.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '17 * * * *')
    permissions:
      contents: write # push the one migration branch
      pull-requests: write # open the one pull request
      id-token: write
    uses: ajitheee/mendr/.github/workflows/reusable-migrate.yml@e68f6047fd38b8bec284296e33a0806c762a41e3
    with:
      app-url: https://mendr-app.onrender.com
      approval: ${{ inputs.approval }}
