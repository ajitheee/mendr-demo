# PROOF 2 (throwaway branch, never merged): a broken scanner pin must fail red and
# leave the last stored result untouched — nothing is posted, no check is written,
# and the overview keeps the last completed scan.
name: mendr
on:
  pull_request: {}
permissions: {}
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit against an UNSIGNED registry copy (unknown age ⇒ stale ⇒ inconclusive)
        env:
          MENDR_SPEC: v0.0.0-does-not-exist
          MENDR_APP_URL: https://mendr-app.onrender.com
          MENDR_REGISTRY_REFRESH: 'off'
        run: |
          curl -sSL -o /tmp/registry-unsigned.json https://github.com/ajitheee/mendr/releases/download/registry-latest/llm-deprecations.json
          export MENDR_REGISTRY_FILE=/tmp/registry-unsigned.json
          set +e
          npx --yes "github:ajitheee/mendr#$MENDR_SPEC" audit . --sha "${{ github.event.pull_request.head.sha || github.sha }}" --json > mendr-audit.json
          MENDR_STATUS=$?
          set -e
          echo "audit exit code: $MENDR_STATUS (3 = inconclusive)"
          if [ -s mendr-audit.json ]; then
            TOKEN=$(curl -sS --retry 3 --retry-delay 2 --retry-all-errors -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=mendr" | jq -r .value)
            curl -sS --fail-with-body --retry 4 --retry-delay 5 --retry-all-errors --max-time 120 -X POST "$MENDR_APP_URL/api/ingest" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary @mendr-audit.json
          fi
          exit $MENDR_STATUS
